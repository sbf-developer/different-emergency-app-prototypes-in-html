function render(){const s=scenarios[state.scenario],step=s.steps[state.step],id=state.scenario+'-'+state.step;const checked=state.done[id]||[];
document.title=t('Rolig · Én ting ad gangen','Rolig · One thing at a time');
document.getElementById('app').innerHTML=header('rolig','sun',`<a href="#guide">${t('Øv en situation','Practise a situation')}</a><a href="#sources">${t('Kilder','Sources')}</a>`)+`<main class="page rolig-page" id="main"><div class="notice exercise row">${icon('book')}<span>${t('ØVELSE · Ingen aktuel hændelse. Ingen livevarsler.','PRACTICE · No current incident. No live alerts.')}</span></div><section class="rolig-hero"><div><div class="eyebrow">${t('Din guide til at øve beredskab','Your guide to practising preparedness')}</div><h1>${t('Én ting<br>ad gangen.','One thing<br>at a time.')}</h1><p class="lead">${t('Når noget uventet sker, hjælper en enkel plan. Lær de vigtigste skridt i ro og mag.','When the unexpected happens, a simple plan helps. Learn the essential steps at your own pace.')}</p></div><div class="orbit" aria-hidden="true">${icon('sun')}<i></i></div></section><div class="scenario-tabs" role="group" aria-label="${t('Vælg øvelse','Choose an exercise')}">${Object.entries(scenarios).map(([key,x])=>`<button class="scenario-tab ${state.scenario===key?'active':''}" aria-pressed="${state.scenario===key}" onclick="selectScenario('${key}')">${icon(x.icon,'big')}<span><strong>${t(...x.title)}</strong><small>${t(...x.sub)}</small></span></button>`).join('')}</div><section class="guide-layout" id="guide"><aside><div class="eyebrow" style="margin-top:10px">${t('Din øvelse','Your practice')}</div><div class="guide-index">${s.steps.map((x,i)=>`<button class="${i===state.step?'active':''}" onclick="goStep(${i})" ${i===state.step?'aria-current="step"':''}><span>${i+1}</span><b>${t(...x.title)}</b></button>`).join('')}</div><div class="subtle muted" style="padding:15px 8px">${t('Din fremdrift gemmes på denne enhed.','Your progress is saved on this device.')}</div></aside><article class="card guide-step"><div class="row between step-top"><span class="badge">${t('Trin','Step')} ${state.step+1} / 3</span><span class="subtle muted">${checked.length}/${step.tasks.length} ${t( document.querySelectorAll('[data-step-task]').forEach(el=>el.onchange=()=>{const i=Number(el.dataset.stepTask);state.done[id]=el.checked?[...new Set([...checked,i])]:checked.filter(x=>x!==i);persist();document.querySelector(`[data-step-task="${i}"]`)?.focus();});
}
function persist(){save(KEY,state);updatePage();}
function selectScenario(key){state.scenario=key;state.step=0;persist();}
function goStep(i){state.step=Math.min(2,Math.max(0,i));persist();document.getElementById('step-title')?.focus({preventScroll:true});}
function finishPractice(){const s=scenarios[state.scenario],complete=s.steps.every((step,i)=>(state.done[state.scenario+'-'+i]||[]).length===step.tasks.length);toast(complete?t('Øvelsen er gennemgået. Genbesøg den gerne senere.','Practice reviewed. You can revisit it any time.'):t('Du har stadig punkter at gennemgå i øvelsen.','You still have items to review in this exercise.'));}
